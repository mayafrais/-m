<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBEFF2">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="הורות">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="יומן משותף להנקה, שינה, תרופות, טעימות והתפתחות, לשני ההורים.">
<title>הורות: הנקה, התפתחות, טעימות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app, max 480px; nursing circle is the single bold element; bottom tab bar. */
:root{
  --bg:#FBEFF2; --surface:#FFFFFF; --ink:#261B2E; --ink2:#5C5066; --mist:#F1E1E8; --line:#EBD6DF;
  --dusk:#3B4F86; --on-dusk:#FFFFFF; --dawn:#F2A65A; --on-dawn:#261B2E; --dawn-soft:#FCE6CF; --dawn-text:#7A4210;
  --sage:#2F7A5B; --sage-soft:#E3F2EA; --danger:#8A3226; --danger-soft:#FBEAE7; --on-danger:#FFFFFF; --focus:#F2A65A;
  --font:'IBM Plex Sans Hebrew','IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14111C; --surface:#1F1A2A; --ink:#F1ECF6; --ink2:#B9B0C6; --mist:#2A2338; --line:#342C44;
  --dusk:#A9B9EE; --on-dusk:#14111C; --dawn:#F2A65A; --on-dawn:#261B2E; --dawn-soft:#3A2A1C; --dawn-text:#F7C48F;
  --sage:#6FC79C; --sage-soft:#1D3329; --danger:#F0A39A; --danger-soft:#3A1F1C; --on-danger:#2A1210; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#14111C; --surface:#1F1A2A; --ink:#F1ECF6; --ink2:#B9B0C6; --mist:#2A2338; --line:#342C44;
  --dusk:#A9B9EE; --on-dusk:#14111C; --dawn:#F2A65A; --on-dawn:#261B2E; --dawn-soft:#3A2A1C; --dawn-text:#F7C48F;
  --sage:#6FC79C; --sage-soft:#1D3329; --danger:#F0A39A; --danger-soft:#3A1F1C; --on-danger:#2A1210; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--dusk)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{flex:1;padding-block:8px 120px;display:flex;flex-direction:column;gap:22px}
h1{margin:0;font-size:1.875rem;line-height:1.15;font-weight:600;text-wrap:balance}
h2{margin:0;font-size:1rem;font-weight:600;text-wrap:balance}
p{margin:0}
.muted{color:var(--ink2)}
.small{font-size:.8125rem}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink2);font-size:.8125rem;text-decoration:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sage);display:inline-block}
.seg{display:grid;gap:4px;padding:4px;border-radius:999px;background:var(--mist)}
.seg button{min-height:40px;border:0;border-radius:999px;background:transparent;color:var(--ink2);font-weight:500;padding:0 12px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(38,27,46,.18)}
.btn{min-height:52px;padding:0 20px;border-radius:999px;border:0;background:var(--dusk);color:var(--on-dusk);font-weight:600;font-size:1rem}
.btn.ghost{background:transparent;border:1.5px solid var(--dusk);color:var(--dusk)}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.block{width:100%}
.link{min-height:44px;display:inline-flex;align-items:center;background:none;border:0;color:var(--dusk);font-weight:500;padding:0 4px;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* Nursing circle */
.feed{display:flex;flex-direction:column;align-items:center;gap:14px}
.circle{direction:ltr;display:flex;gap:8px;width:min(256px,72vw);aspect-ratio:1;max-width:100%}
.half{flex:1;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 14px;text-align:center;line-height:1.35;background:var(--mist);color:var(--ink)}
.half.l{border-radius:999px 18px 18px 999px}
.half.r{border-radius:18px 999px 999px 18px}
.half .big{font-size:1.5rem;font-weight:500}
.half .sub{font-size:.8125rem}
.half.ended{box-shadow:inset 0 0 0 3px var(--dawn)}
.half.active{background:var(--dusk);color:var(--on-dusk)}
.half.active .big{font-size:2.1rem;font-variant-numeric:tabular-nums}
/* Quick log */
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:var(--ink);font-size:.75rem;padding:0}
.qbtn .ic{width:52px;height:52px;border-radius:50%;background:var(--mist);display:flex;align-items:center;justify-content:center}
.qbtn[aria-pressed="true"] .ic{background:var(--dusk);color:var(--on-dusk)}
.section{display:flex;flex-direction:column;gap:10px}
.rule{padding-top:18px;border-top:1px solid var(--line)}
.ribbon{direction:ltr;position:relative;height:34px}
.ribbon .track{position:absolute;inset:15px 0 auto;height:4px;border-radius:2px;background:var(--mist)}
.ribbon .sleep{position:absolute;top:13px;height:8px;border-radius:4px;background:var(--dusk);opacity:.4}
.ribbon .mark{position:absolute;top:9px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--dawn);border:2px solid var(--bg)}
.axis{direction:ltr;display:flex;justify-content:space-between;font-size:.6875rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;font-size:.75rem;color:var(--ink2)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.time{direction:ltr;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:44px;font-size:.875rem}
.grow{flex:1;min-width:0}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink2);display:flex;align-items:center;justify-content:center;flex:none}
.confirm{display:flex;gap:6px}
.confirm button{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8125rem}
.confirm .yes{background:var(--danger);color:var(--bg);border-color:var(--danger)}
.empty{padding:20px;border-radius:24px;border:1.5px dashed var(--line);color:var(--ink2);text-align:center}
.card{background:var(--surface);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.dark-card{background:var(--ink);color:var(--bg);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px}
.badge{align-self:flex-start;font-size:.75rem;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--dawn-soft);color:var(--dawn-text)}
.ok{background:var(--sage-soft);color:var(--sage)}
.note{font-size:.75rem;color:var(--ink2);line-height:1.6}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=time],input[type=date],select{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:1rem}
.stepper{direction:ltr;display:flex;align-items:center;gap:14px}
.stepper button{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:1.4rem}
.stepper output{min-width:96px;text-align:center;font-size:1.375rem;font-weight:600;font-variant-numeric:tabular-nums}
.warn{border:2px solid var(--danger);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.warn h2{color:var(--danger)}
.prose{font-size:1.0625rem;line-height:1.75;max-width:65ch}
.prose ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px}
/* Bottom nav */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.brand{display:inline-flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.9375rem}
.brand svg{color:var(--dusk)}
.share-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:0;background:var(--dusk);color:var(--on-dusk);font-weight:600;font-size:.875rem}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;text-decoration:none;font-size:.6875rem;color:var(--ink2)}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:600}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(20,17,28,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{padding:0;margin-bottom:10px;font-weight:600}
.banner{font-size:.8125rem;padding:10px 14px;border-radius:14px;background:var(--dawn-soft);color:var(--dawn-text)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.topic{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);background:none;border-inline:0;border-top:0;width:100%;text-align:start}
.mono{width:44px;height:44px;border-radius:50%;background:var(--mist);color:var(--dusk);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.mono.warm{background:var(--dawn-soft);color:var(--dawn-text)}
.stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.stages li{display:flex;flex-direction:column;gap:6px;font-size:.6875rem;opacity:.75}
.stages li span{height:4px;border-radius:2px;background:currentColor;opacity:.5}
.stages li[aria-current="step"]{opacity:1;color:var(--dawn);font-weight:600}
.stages li[aria-current="step"] span{opacity:1}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:88px;padding:18px;border:0;border-radius:24px;background:var(--surface);color:var(--ink);text-align:start;box-shadow:0 1px 2px rgba(38,27,46,.06)}
.opt.primary{background:var(--dusk);color:var(--on-dusk)}
.opt-ic{width:48px;height:48px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--mist);color:var(--dusk)}
.opt.primary .opt-ic{background:var(--dawn);color:var(--on-dawn)}
.opt-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.opt-t{font-weight:600;font-size:1.0625rem}
.opt-h{font-size:.875rem;opacity:.8}
.opt .chev{flex:none;opacity:.7}
[dir=rtl] .opt .chev{transform:scaleX(-1)}
.view>*{min-width:0}
.seg-scroll{max-width:100%;min-width:0;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.seg-scroll::-webkit-scrollbar{display:none}
.seg-scroll .chip{flex:none;position:relative}
.chip[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.75rem;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--mist);color:var(--ink2)}
.tag.warm{background:var(--dawn-soft);color:var(--dawn-text)}
.tag.ok{background:var(--sage-soft);color:var(--sage)}
:root:not([data-theme="dark"]) .tag.ok{color:#256449}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.ok{color:var(--sage)}}
.foods{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.food{background:var(--surface);border-radius:20px;overflow:hidden}
.food-head{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:10px 14px;border:0;background:transparent;color:var(--ink);text-align:start}
.food-head .chev{flex:none;opacity:.6;transition:transform .2s}
.food.open .food-head .chev{transform:rotate(180deg)}
.food-body{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px}
.food-body h3{margin:4px 0 0;font-size:.9375rem}
.thumb{width:56px;height:56px;border-radius:14px;object-fit:cover;flex:none;background:var(--mist)}
.thumb.emoji{display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.thumb.letter{font-size:1.375rem;font-weight:600;color:var(--dusk)}
.food-img{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;border-radius:16px;background:var(--mist)}
.done{color:var(--sage);display:inline-flex}
.al-dot{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex:none;box-shadow:inset 0 0 0 3px var(--surface)}
.bul{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px;line-height:1.6}
.img-pair{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.img-pair img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:14px;background:var(--mist)}
.home-small{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt.slim{min-height:72px;padding:14px;flex-direction:column;align-items:flex-start;gap:8px}
.opt.slim .chev{display:none}
.opt.slim .opt-ic{width:40px;height:40px}
.opt.slim .opt-h{font-size:.8125rem}
details summary{list-style:none;min-height:44px;display:flex;align-items:center}
details summary::-webkit-details-marker{display:none}
input[type=search]{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:1rem}
.dev-img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:18px;background:var(--mist)}
.table-wrap{overflow-x:auto;border-radius:16px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:.875rem;line-height:1.45}
.tbl th,.tbl td{padding:10px 12px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl thead th{font-weight:600;color:var(--ink2);font-size:.8125rem}
.tbl tbody th{font-weight:600}
.tbl tr:last-child th,.tbl tr:last-child td{border-bottom:0}
.opt.friends{background:var(--dawn-soft);color:var(--dawn-text);min-height:72px}
.opt.friends .opt-h{opacity:1}
.opt.friends .opt-ic{background:var(--surface);color:var(--dawn-text)}
.share-friends{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:44px}
.pos-img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:16px;background:var(--mist)}
.safety{background:var(--danger-soft);border:2px solid var(--danger);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.safety h2{color:var(--danger);margin:0;font-size:1.1875rem}
.safety ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.safety li{display:flex;gap:10px;align-items:flex-start;font-weight:400;line-height:1.5;color:var(--ink);font-size:.9375rem}
.safety strong{font-weight:700}
.safety p{font-size:.9375rem}
.safety p{margin:0;line-height:1.6}
.btn.sos{background:var(--danger);color:var(--on-danger);display:flex;align-items:center;justify-content:center;text-decoration:none}
.sos-pill{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 12px;border-radius:999px;background:var(--danger);color:var(--on-danger);font-weight:700;font-size:.875rem;text-decoration:none}
[tabindex="-1"]:focus{outline:none}
.ntabs a.chip{text-decoration:none;display:inline-flex;align-items:center;color:var(--ink)}
.ntabs a.chip[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rfacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.rfacts div{display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.08);border-radius:14px;padding:10px}
.rfacts .muted{color:inherit;opacity:.8}
.rfacts strong{font-size:.875rem;line-height:1.35}
.rtime{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rtime li{display:grid;grid-template-columns:96px 28px 1fr;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:10px 12px;line-height:1.45}
.rtime .rt{font-variant-numeric:tabular-nums;font-weight:600;font-size:.875rem;text-align:end}
.rtime li.k-sleep,.rtime li.k-night{background:var(--mist)}
.ri{font-size:1.2rem;text-align:center}
.bedtime{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:b}
.bedtime li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:14px;padding:12px}
.install-card{background:var(--surface);border:2px dashed var(--dawn);min-height:72px;align-items:center}
.check-chip{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.check-chip input{width:20px;height:20px;accent-color:var(--danger);margin:0}
.ntabs,.wrap-tabs{flex-wrap:wrap;overflow:visible}
.ntabs .chip,.seg-scroll .chip{min-height:40px;padding:0 14px;font-size:.9375rem}
details.acc{background:var(--surface);border-radius:20px;overflow:hidden}
details.acc>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:12px 16px;cursor:pointer;font-weight:600;font-size:1.0625rem}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"";width:10px;height:10px;border-inline-end:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s;flex:none;opacity:.6;margin-inline-start:4px}
details.acc[open]>summary::after{transform:rotate(-135deg)}
details.acc>.acc-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
details.acc.warn-acc>summary{color:var(--danger)}
img.logo{border-radius:28%;display:block;flex:none;object-fit:cover}
.safety-acc{padding:0}
.safety-acc>summary{list-style:none;display:flex;flex-direction:column;gap:2px;padding:14px 16px;cursor:pointer;color:var(--danger);font-weight:700;font-size:1.0625rem}
.safety-acc>summary::-webkit-details-marker{display:none}
.safety-acc>.safety-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.modal-back{position:fixed;inset:0;background:rgba(20,10,20,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal{max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
@media(min-width:600px){.modal-back{align-items:center}}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:1.75rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8125rem;color:var(--ink2)}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;direction:ltr;padding-top:8px}
.bars i{flex:1;min-width:0;background:var(--dusk);border-radius:4px 4px 0 0}
.bars i.z{background:var(--line)}
.bars-ax{display:flex;justify-content:space-between;direction:ltr;font-size:.75rem;color:var(--ink2)}
.hbar{display:grid;grid-template-columns:7.5em minmax(0,1fr) 2.5em;gap:8px;align-items:center;font-size:.875rem}
.hbar .tr{height:12px;border-radius:6px;background:var(--mist);overflow:hidden}.hbar .tr i{display:block;height:100%;background:var(--dawn);border-radius:6px}
.hbar b{text-align:left;font-variant-numeric:tabular-nums}
.utable{width:100%;border-collapse:collapse;font-size:.8125rem}
.utable th,.utable td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.utable th{color:var(--ink2);font-weight:600}
.uwrap{overflow-x:auto}
</style>
</head>

  const deep=(a,b)=>{ const r=Object.assign({},a); for(const k in b){ const v=b[k]; r[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&r[k]&&typeof r[k]==='object')?deep(r[k],v):v; } return r; };
  S.family=deep(S.family,patch); render();
  if(!this.fid) return;
  const {data,error}=await this.sb.rpc('patch_family_state',{p_family:this.fid,p_patch:patch});
  if(error){ say(at().notSaved); this.load_family(); return; }
  if(data){ S.family={babies:data.babies||[],active:data.active||{},sleep:data.sleep||{},milestones:data.milestones||{},allergens:data.allergens||{},prefs:data.prefs||{}}; render(); }
 },
 async addEvent(ev){
  const {baby,type,t:tm}=ev; const rest=Object.assign({},ev); delete rest.baby; delete rest.type; delete rest.t;
  const tmp={id:'tmp'+uid(),baby,type,t:tm,by:S.me}; Object.assign(tmp,rest); S.events=[tmp].concat(S.events).sort((a,b)=>b.t-a.t); render();
  const {error}=await this.sb.from('events').insert({family_id:this.fid,baby,type,t:tm,data:rest});
  if(error) say(at().notSaved);
  this.load_events();
 },
 async delEvent(id){ S.events=S.events.filter(e=>e.id!==id); render(); if(String(id).startsWith('tmp')) return; await this.sb.from('events').delete().eq('id',id); this.load_events(); },
 async addMed(m){ const {error}=await this.sb.from('meds').insert({family_id:this.fid,baby:m.baby,name:m.name,note:m.note||''}); if(error) say(at().notSaved); this.load_meds(); },
 async delMed(id){ S.meds=S.meds.filter(m=>m.id!==id); render(); await this.sb.from('meds').delete().eq('id',id); this.load_meds(); },
 async createFamily(name,babies){

// ---------- derived ----------
function baby(){ const b=S.family.babies||[]; return b.find(x=>x.id===S.babyId)||b[0]||null; }
function evs(){ const b=baby(); return b?S.events.filter(e=>e.baby===b.id):[]; }
function whoLabel(id){ if(!id) return ''; if(id===S.me) return t().you; const m=(S.members||[]).find(x=>x.user_id===id); return (m&&m.display_name)||t().partner; }
let resolving=false;
async function resolveNames(){
 return;
 const ids=[...new Set(S.events.map(e=>e.by).concat(Object.values(S.family.active||{}).map(a=>a&&a.by)).filter(Boolean))].filter(id=>!(id in S.names)&&id!==S.me);
 if(!ids.length) return;
 resolving=true;
 try{ const ps=await Store.user.profiles(ids); let changed=false; ids.forEach(id=>{const n=(ps[id]&&ps[id].name)||'';S.names[id]=n||t().partner;changed=true;}); if(changed) render(); }catch(e){}
 resolving=false;
}
function ageWeeks(b){ if(!b||!b.born) return null; const d=(Date.now()-new Date(b.born+'T00:00:00').getTime())/864e5; return d<0?null:d; }
function stageIndex(days){ if(days==null) return 2; if(days<7) return 0; if(days<14) return 1; if(days<21) return 2; if(days<42) return 3; return 4; }
function evText(e){
 const L=t();
 if(e.type==='feed') return L.ev.feed+', '+(e.side==='L'?L.left:e.side==='R'?L.right:L.both)+(e.mins?', '+e.mins+' '+L.min:'');
 if(e.type==='bottle') return L.ev.bottle+(e.ml?', '+e.ml+' '+L.ml:'');
 if(e.type==='pump') return L.ev.pump+(e.ml?', '+e.ml+' '+L.ml:'');
 if(e.type==='diaper') return L.ev.diaper+', '+(L.kinds[e.kind]||'');
 if(e.type==='sleep') return L.ev.sleep+(e.mins?', '+e.mins+' '+L.min:'');
 if(e.type==='med') return e.medName||L.ev.med;
 if(e.type==='taste'){ const F=FT[S.lang]||FT.he; const lk=F.likes.find(l=>l[0]===e.liked); return F.tasteEv+': '+fname(e.food)+(lk?', '+lk[1]:'')+(e.reaction?', '+F.reactionEv:''); }
 return '';
}

  '<fieldset><legend>'+esc(L.when)+'</legend>'+chips('when',[[15,L.ago15],[30,L.ago30],[60,L.ago60]],sheet.when)+'<label class="field" for="sh-time" style="font-weight:400">'+esc(L.exact)+'<input id="sh-time" type="time" dir="ltr" value="'+esc(sheet.exact||'')+'"></label></fieldset>';
 if(sheet.type==='feed') body+='<fieldset><legend>'+esc(L.whichSide)+'</legend><div dir="ltr">'+chips('side',[['L',L.left],['B',L.both],['R',L.right]],sheet.side)+'</div></fieldset>';
 if(sheet.type==='feed'||sheet.type==='sleep') body+='<fieldset><legend>'+esc(L.howLong)+'</legend><div class="stepper"><button type="button" data-sh="mins" data-v="-5" aria-label="'+esc(L.less5)+'">−</button><output aria-live="polite">'+sheet.mins+' '+esc(L.min)+'</output><button type="button" data-sh="mins" data-v="5" aria-label="'+esc(L.more5)+'">+</button></div></fieldset>';
 if(sheet.type==='bottle'||sheet.type==='pump') body+='<fieldset><legend>'+esc(L.howMuch)+'</legend><div class="stepper"><button type="button" data-sh="ml" data-v="-10" aria-label="'+esc(L.less10)+'">−</button><output aria-live="polite">'+sheet.ml+' '+esc(L.ml)+'</output><button type="button" data-sh="ml" data-v="10" aria-label="'+esc(L.more10)+'">+</button></div></fieldset>';
 if(sheet.mode==='taste') body+=tasteSheetBody();
 if(sheet.mode==='share'){ const b=baby(); const msg=L.shareMsg(b?b.name:'')+inviteLink()+'\n'+at().shareCode(S.invite||''); body+='<div class="card" style="align-items:center;gap:4px"><span class="small muted">'+esc(at().codeLabel)+'</span><span dir="ltr" style="font-size:2rem;font-weight:700;letter-spacing:6px;font-variant-numeric:tabular-nums">'+esc(S.invite||'')+'</span></div>'; body+='<p>'+esc(at().inviteText)+'</p><a class="btn block" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="https://wa.me/?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener">'+esc(L.whatsapp)+'</a><button type="button" class="btn ghost block" data-sh="copy">'+esc(sheet.copied?L.copied:L.copy)+'</button><p id="share-url" dir="ltr" class="small" style="user-select:all;word-break:break-all;padding:10px 12px;border-radius:12px;background:var(--surface)">'+esc(inviteLink())+'</p>'; }
 if(sheet.mode==='friends'){ const X=SF[S.lang]||SF.he, sh=shareInfo(sheet.kind); body+='<div class="card" style="gap:6px"><span class="small muted">'+esc(X.preview)+'</span><p style="line-height:1.6;white-space:pre-line">'+esc(sh.text)+'</p><p dir="ltr" class="small" style="word-break:break-all;color:var(--dusk)" id="share-url">'+esc(sh.url)+'</p></div><a class="btn block" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="https://wa.me/?text='+encodeURIComponent(sh.full)+'" target="_blank" rel="noopener">'+esc(L.whatsapp)+'</a><button type="button" class="btn ghost block" data-sh="copyfull">'+esc(sheet.copied?L.copied:L.copy)+'</button>'+(navigator.share?'<button type="button" class="btn ghost block" data-sh="native">'+esc(X.more)+'</button>':'')+'<p class="small muted">'+esc(X.note)+'</p>'; }
 if(sheet.type==='diaper') body+='<fieldset><legend>'+esc(L.whichKind)+'</legend>'+chips('kind',[['wet',L.kinds.wet],['dirty',L.kinds.dirty],['both',L.kinds.both]],sheet.kind)+'</fieldset>';
 r.innerHTML='<div class="scrim" data-sh="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title" dir="'+L.dir+'" lang="'+S.lang+'"><h2 id="sh-title" style="font-size:1.375rem">'+esc(title)+'</h2>'+body+
  ((sheet.mode==='share'||sheet.mode==='friends')?'<button type="button" class="link" data-sh="cancel">'+esc(L.close)+'</button></div></div>':'<div class="section" style="gap:8px"><button type="button" class="btn block" data-sh="save">'+esc(L.save)+'</button><button type="button" class="btn ghost block" data-sh="cancel">'+esc(L.cancel)+'</button></div></div></div>');
 const first=r.querySelector('.sheet button'); if(first&&!r.contains(document.activeElement)) first.focus();
}
document.getElementById('sheet-root').addEventListener('click',e=>{
 const el=e.target.closest('[data-sh]'); if(!el||!sheet) return;
 const k=el.dataset.sh, v=el.dataset.v;
 if(k==='scrim'){ if(e.target===el) closeSheet(); return; }
 if(k==='cancel') return closeSheet();
 if(k==='save') return saveSheet();
 if(k==='copy'){ const done=()=>{ sheet.copied=true; drawSheet(); say(t().copied); }; const sel=()=>{ const n=document.getElementById('share-url'); if(n){ const r=document.createRange(); r.selectNodeContents(n); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} }; try{ navigator.clipboard.writeText(inviteLink()).then(done,sel); }catch(e){ sel(); } return; }
 if(k==='copyfull'){ const sh=shareInfo(sheet.kind); const done=()=>{ sheet.copied=true; drawSheet(); say(t().copied); }; try{ navigator.clipboard.writeText(sh.full).then(done,()=>{}); }catch(e){} return; }
 if(k==='native'){ const sh=shareInfo(sheet.kind); try{ navigator.share({title:t().appName,text:sh.text,url:sh.url}).catch(()=>{}); }catch(e){} return; }
 if(k==='mins') sheet.mins=Math.max(1,Math.min(180,sheet.mins+Number(v)));
 else if(k==='ml') sheet.ml=Math.max(10,Math.min(400,sheet.ml+Number(v)));
 else if(k==='when'){ sheet.when=Number(v); sheet.exact=''; }
 else if(k==='rtype'){ const r=sheet.reactionTypes||(sheet.reactionTypes=[]); const i=r.indexOf(v); if(i<0) r.push(v); else r.splice(i,1); }
 else sheet[k]=v;
 const keep=k; drawSheet(); const again=document.querySelector('#sheet-root [data-sh="'+keep+'"]'+(v?'[data-v="'+v+'"]':'')); if(again) again.focus();
});
document.getElementById('sheet-root').addEventListener('change',e=>{ if(e.target.id==='sh-react'&&sheet){ sheet.reaction=e.target.checked; drawSheet(); const c=document.getElementById('sh-react'); if(c) c.focus(); } });
document.getElementById('sheet-root').addEventListener('input',e=>{ if(e.target.id==='sh-time'&&sheet){ sheet.exact=e.target.value; sheet.when=-1; } if(e.target.id==='sh-note'&&sheet){ sheet.note=e.target.value; } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&sheet) closeSheet(); });
function saveSheet(){
 const L=t(), b=baby(); if(!b) return;
 let tm=Date.now();
 if(sheet.mode==='past'){
  if(sheet.exact){ const [h,m]=sheet.exact.split(':').map(Number); const d=new Date(); d.setHours(h,m,0,0); if(d.getTime()>Date.now()) d.setDate(d.getDate()-1); tm=d.getTime(); }
  else tm=Date.now()-(sheet.when||15)*60000;
 }
 const ev={baby:b.id,type:sheet.type,t:tm,past:sheet.mode==='past'};
 if(sheet.mode==='taste'){ ev.food=sheet.food; ev.liked=sheet.liked; ev.style=sheet.style; ev.reaction=!!sheet.reaction; ev.reactionTypes=sheet.reaction?(sheet.reactionTypes||[]):[]; if(sheet.note) ev.note=sheet.note.trim(); ev.past=false; }
 if(sheet.type==='feed'){ev.side=sheet.side;ev.mins=sheet.mins;}
 if(sheet.type==='sleep'){ev.mins=sheet.mins;}
 if(sheet.type==='bottle'||sheet.type==='pump'){ev.ml=sheet.ml;}
 if(sheet.type==='diaper'){ev.kind=sheet.kind;}
 Store.addEvent(ev); closeSheet(); say(S.mode==='db'?L.savedBoth:L.saved);
}

// ---------- actions ----------
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]'); if(!el) return;
 const a=el.dataset.act, L=t(), b=baby();
 if(a==='baby'){ S.devAge=null; S.babyId=el.dataset.id; ls.set('gp-baby',S.babyId); render(); return; }
 if(a==='authmode'){ S.authMode=S.authMode==='login'?'signup':'login'; S.authMsg=''; render(); return; }
 if(a==='onb'){ S.onb=el.dataset.v; S.authMsg=''; render(); return; }
 if(a==='logout'){ Store.signOut(); return; }
 if(a==='share'){ openSheet({mode:'share',type:'share'}); return; }
 if(a==='sharefriends'){ shareFriends(el.dataset.v||'app'); return; }
 if(a==='devage'){ S.devAge=Number(el.dataset.v); render(); return; }
 if(a==='safetyack'){ ls.set('gp-safety-ack',true); render(); return; }
 if(a==='safetytoggle'){ e.preventDefault(); S.safetyOpen=!S.safetyOpen; render(); return; }
 if(a==='installdismiss'){ ls.set('gp-install-dismissed',true); render(); return; }
 if(a==='installnow'){ if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(()=>{ installEvt=null; render(); }); } return; }
 if(a==='adminrefresh'){ loadAdmin(); return; }
 if(a==='hday'){ S.histDay=Number(el.dataset.v); S.confirmDel=null; render(); return; }
 if(a==='rage'){ S.routineAge=Number(el.dataset.v); render(); return; }
 if(a==='devnow'){ S.devAge=null; render(); return; }
 if(a==='fsub'){ S.foodSub=el.dataset.v; S.confirmDel=null; render(); window.scrollTo(0,0); return; }
 if(a==='lang'){ S.lang=el.dataset.v; ls.set('gp-lang',S.lang); render(); return; }
 if(a==='theme'){ S.theme=el.dataset.v; ls.set('gp-theme2',S.theme); render(); return; }
 if(a==='addbaby'){ const bs=(S.family.babies||[]).slice(); bs.push({id:'b'+uid(),name:L.babyName+' '+(bs.length+1)}); Store.fam({babies:bs}); render(); return; }
 if(a==='rmbaby'){ const bs=(S.family.babies||[]).filter(x=>x.id!==el.dataset.id); Store.fam({babies:bs}); render(); return; }
 if(!b) return;
 if(a==='start'){ Store.fam({active:{[b.id]:{side:el.dataset.side,start:Date.now(),by:S.me||null,first:el.dataset.side}}}); render(); say(L.nursingNow); return; }
 if(a==='switch'){ const cur=S.family.active[b.id]; if(cur) Store.fam({active:{[b.id]:Object.assign({},cur,{side:el.dataset.side,switched:true})}}); render(); return; }
 if(a==='finish'){ const cur=S.family.active[b.id]; if(!cur) return; const mins=Math.max(1,Math.round((Date.now()-cur.start)/60000));
  Store.addEvent({baby:b.id,type:'feed',t:cur.start,mins,side:cur.switched?'B':cur.side,last:cur.side}); Store.fam({active:{[b.id]:null}}); render(); say(S.mode==='db'?L.savedBoth:L.saved); return; }
 if(a==='taste'){ const pf=(S.family.prefs||{}).feedingStyle; openSheet({mode:'taste',type:'taste',food:el.dataset.food,liked:'yes',style:S.foodStyle||(pf==='blw'?'blw':'mashed'),reaction:false,reactionTypes:[],note:''}); return; }
 if(a==='food'){ S.openFood=S.openFood===el.dataset.food?null:el.dataset.food; render(); return; }
 if(a==='untaste'){ S.confirmUntaste=el.dataset.food; render(); return; }
 if(a==='untasteno'){ S.confirmUntaste=null; render(); return; }
 if(a==='untasteyes'){ const fid=el.dataset.food; const e=evs().find(x=>x.type==='taste'&&(LEGACY_FOOD[x.food]||x.food)===fid); if(e) Store.delEvent(e.id); S.confirmUntaste=null; say(t().saved); render(); return; }
 if(a==='fstyle'){ S.foodStyle=el.dataset.v; render(); return; }
 if(a==='rstage'){ S.recStage=el.dataset.v; render(); return; }
 if(a==='rtex'){ S.recTex=el.dataset.v; render(); return; }
 if(a==='feedstyle'){ Store.fam({prefs:{feedingStyle:el.dataset.v}}); S.foodStyle=null; say(L.saved); return; }
 if(a==='fcat'){ S.foodCat=el.dataset.v; render(); return; }
 if(a==='recipe'){ const i=el.dataset.i; S.openRecipe=S.openRecipe===i?null:i; render(); return; }
 if(a==='past'){ openSheet({mode:'past',type:'feed',when:15}); return; }
 if(a==='quick'){ const ty=el.dataset.type; openSheet({mode:'now',type:ty}); return; }
 if(a==='sleep'){ const s=(S.family.sleep||{})[b.id];
  if(s){ const mins=Math.max(1,Math.round((Date.now()-s.start)/60000)); Store.addEvent({baby:b.id,type:'sleep',t:s.start,mins}); Store.fam({sleep:{[b.id]:null}}); say(L.saved); }
  else Store.fam({sleep:{[b.id]:{start:Date.now(),by:S.me||null}}});
  render(); return; }
 if(a==='delask'){ S.confirmDel=el.dataset.id; render(); return; }
 if(a==='delno'){ S.confirmDel=null; render(); return; }
 if(a==='delyes'){ Store.delEvent(el.dataset.id); S.confirmDel=null; render(); return; }
 if(a==='medgive'){ const m=S.meds.find(x=>x.id===el.dataset.id); if(m){ Store.addEvent({baby:b.id,type:'med',t:Date.now(),medId:m.id,medName:m.name}); say(L.saved); } return; }
 if(a==='medundo'){ Store.delEvent(el.dataset.id); return; }
 if(a==='medask'){ S.confirmMed=el.dataset.id; render(); return; }
 if(a==='medno'){ S.confirmMed=null; render(); return; }
 if(a==='medyes'){ Store.delMed(el.dataset.id); S.confirmMed=null; render(); return; }
});
document.addEventListener('submit',e=>{
 const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
 const L=t();
 if(f.dataset.form==='auth'){
  const A=at(), up=S.authMode!=='login', email=document.getElementById('auth-email').value.trim(), pw=document.getElementById('auth-pw').value;
  const minPw=up?8:6; if(!email||pw.length<minPw){ S.authMsg=pw.length<minPw?A.weakPw:A.authErr; render(); return; }
  S.busy=true; S.authMsg=''; render();
  (async()=>{ try{ if(up){ const {data,error}=await Store.sb.auth.signUp({email,password:pw}); if(error) throw error; if(!data.session) S.authMsg=A.checkEmail; } else { const {error}=await Store.sb.auth.signInWithPassword({email,password:pw}); if(error) throw error; } }
   catch(err){ const msg=(err&&err.message)||''; console.warn('auth',msg);
    if(up&&/already|registered|exists/i.test(msg)){ try{ const r=await Store.sb.auth.signInWithPassword({email,password:pw}); if(r.error) throw r.error; }catch(e2){ S.authMode='login'; S.authMsg=A.exists; } }
    else S.authMsg=A.authErr; } S.busy=false; render(); })();
  return;
 }
 if(f.dataset.form==='join'){
  const A=at(), code=document.getElementById('join-code').value.replace(/\D/g,''), name=document.getElementById('join-name').value.trim();
  if(code.length!==6){ S.authMsg=A.badCode; render(); return; }
  S.busy=true; S.authMsg=''; render();
  Store.joinFamily(code,name).then(()=>{ ls.set('gp-join',''); S.busy=false; S.draft={}; S.onb=''; render(); },(err)=>{ S.busy=false; S.authMsg=/too many/i.test((err&&err.message)||'')?A.tooMany:A.badCode; render(); });
  return;
 }
 if(f.dataset.form==='setup'){
  const n1=document.getElementById('setup-name').value.trim(), born=document.getElementById('setup-born').value, n2el=document.getElementById('setup-name2'), n2=S.setupTwins&&n2el?n2el.value.trim():'';
  if(!n1) return;
  const bs=[{id:'b'+uid(),name:n1,born:born||''}]; if(n2) bs.push({id:'b'+uid(),name:n2,born:born||''});
  S.babyId=bs[0].id; ls.set('gp-baby',S.babyId); document.activeElement&&document.activeElement.blur();
  if(S.fid){ S.draft={}; Store.fam({babies:bs}); render(); return; }
  const me=(document.getElementById('setup-me')||{}).value||''; S.busy=true; S.authMsg=''; render();
  Store.createFamily(me.trim(),bs).then(()=>{ S.draft={}; S.busy=false; S.onb=''; render(); },err=>{ S.busy=false; S.authMsg=at().notSaved+(err&&err.message?' ('+err.message+')':''); render(); }); return;
 }
 if(f.dataset.form==='med'){
  const b=baby(); const n=document.getElementById('med-name').value.trim(), note=document.getElementById('med-note').value.trim(); if(!n||!b) return;
  Store.addMed({name:n,note,baby:b.id}); delete S.draft['med-name']; delete S.draft['med-note']; document.activeElement&&document.activeElement.blur(); say(L.saved); if(!Store.db) return; render();
 }
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='setup-twins'){ S.setupTwins=el.checked; render(); requestAnimationFrame(()=>requestAnimationFrame(()=>{ const n=document.getElementById(el.checked?'setup-name2':'setup-twins'); if(n) n.focus(); })); return; }
 if(el.dataset.myName){ const v=el.value.trim(); if(v){ Store.setMyName(v.slice(0,40)); say(t().saved); } return; }
 if(el.dataset.allergen){ const b=baby(); if(b){ Store.fam({allergens:{[b.id]:{[el.dataset.allergen]:{[el.dataset.k]:el.checked}}}}); say(t().saved); } return; }
 if(el.dataset.ms){ const b=baby(); if(b){ Store.fam({milestones:{[b.id]:{[el.dataset.ms]:el.checked?Date.now():null}}}); say(t().saved); } return; }
 if(el.dataset.babyName!==undefined||el.dataset.babyBorn!==undefined){
  const id=el.dataset.babyName||el.dataset.babyBorn;
  const bs=(S.family.babies||[]).map(x=>x.id===id?Object.assign({},x,el.dataset.babyName!==undefined?{name:el.value.trim()||x.name}:{born:el.value}):x);
  Store.fam({babies:bs}); say(t().saved);
 }
});
document.addEventListener('input',e=>{ const el=e.target; if(el.id==='food-q'){ S.foodQ=el.value; render(); return; } if(el.id&&el.closest('#view')) S.draft[el.id]=el.value; });

// ---------- routing ----------
const VIEWS=['admin','install','calm','pacifier','routine','latch','pump','home','today','feeding','article','meds','family','community','foods','dev'];
function route(){ const h=(location.hash||'').slice(1); S.view=VIEWS.includes(h)?h:'home'; S.confirmDel=null; S.confirmMed=null; draw(); const v=document.getElementById('view'); if(h) v.focus({preventScroll:true}); window.scrollTo(0,0); }
window.addEventListener('hashchange',route);
route();
Store.init();
})();
</script>
