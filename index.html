<!doctype html>
<html lang="he" dir="rtl">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBEFF2">

<title>הנקה ואמהות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app, max 480px; nursing circle is the single bold element; bottom tab bar. */
:root{
  --bg:#FBEFF2; --surface:#FFFFFF; --ink:#261B2E; --ink2:#5C5066; --mist:#F1E1E8; --line:#EBD6DF;
  --dusk:#3B4F86; --on-dusk:#FFFFFF; --dawn:#F2A65A; --on-dawn:#261B2E; --dawn-soft:#FCE6CF; --dawn-text:#7A4210;
  --sage:#2F7A5B; --sage-soft:#E3F2EA; --danger:#8A3226; --focus:#F2A65A;
  --font:'IBM Plex Sans Hebrew','IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14111C; --surface:#1F1A2A; --ink:#F1ECF6; --ink2:#B9B0C6; --mist:#2A2338; --line:#342C44;
  --dusk:#A9B9EE; --on-dusk:#14111C; --dawn:#F2A65A; --on-dawn:#261B2E; --dawn-soft:#3A2A1C; --dawn-text:#F7C48F;
  --sage:#6FC79C; --sage-soft:#1D3329; --danger:#F0A39A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#14111C; --surface:#1F1A2A; --ink:#F1ECF6; --ink2:#B9B0C6; --mist:#2A2338; --line:#342C44;
  --dusk:#A9B9EE; --on-dusk:#14111C; --dawn:#F2A65A; --on-dawn:#261B2E; --dawn-soft:#3A2A1C; --dawn-text:#F7C48F;
  --sage:#6FC79C; --sage-soft:#1D3329; --danger:#F0A39A; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--dusk)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{flex:1;padding-block:8px 120px;display:flex;flex-direction:column;gap:22px}
h1{margin:0;font-size:1.875rem;line-height:1.15;font-weight:600;text-wrap:balance}
h2{margin:0;font-size:1rem;font-weight:600;text-wrap:balance}
p{margin:0}
.muted{color:var(--ink2)}
.small{font-size:.8125rem}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink2);font-size:.8125rem;text-decoration:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sage);display:inline-block}
.seg{display:grid;gap:4px;padding:4px;border-radius:999px;background:var(--mist)}
.seg button{min-height:40px;border:0;border-radius:999px;background:transparent;color:var(--ink2);font-weight:500;padding:0 12px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(38,27,46,.18)}
.btn{min-height:52px;padding:0 20px;border-radius:999px;border:0;background:var(--dusk);color:var(--on-dusk);font-weight:600;font-size:1rem}
.btn.ghost{background:transparent;border:1.5px solid var(--dusk);color:var(--dusk)}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.block{width:100%}
.link{min-height:44px;display:inline-flex;align-items:center;background:none;border:0;color:var(--dusk);font-weight:500;padding:0 4px;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* Nursing circle */
.feed{display:flex;flex-direction:column;align-items:center;gap:14px}
.circle{direction:ltr;display:flex;gap:8px;width:min(256px,72vw);aspect-ratio:1;max-width:100%}
.half{flex:1;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 14px;text-align:center;line-height:1.35;background:var(--mist);color:var(--ink)}
.half.l{border-radius:999px 18px 18px 999px}
.half.r{border-radius:18px 999px 999px 18px}
.half .big{font-size:1.5rem;font-weight:500}
.half .sub{font-size:.8125rem}
.half.ended{box-shadow:inset 0 0 0 3px var(--dawn)}
.half.active{background:var(--dusk);color:var(--on-dusk)}
.half.active .big{font-size:2.1rem;font-variant-numeric:tabular-nums}
/* Quick log */
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:var(--ink);font-size:.75rem;padding:0}
.qbtn .ic{width:52px;height:52px;border-radius:50%;background:var(--mist);display:flex;align-items:center;justify-content:center}
.qbtn[aria-pressed="true"] .ic{background:var(--dusk);color:var(--on-dusk)}
.section{display:flex;flex-direction:column;gap:10px}
.rule{padding-top:18px;border-top:1px solid var(--line)}
.ribbon{direction:ltr;position:relative;height:34px}
.ribbon .track{position:absolute;inset:15px 0 auto;height:4px;border-radius:2px;background:var(--mist)}
.ribbon .sleep{position:absolute;top:13px;height:8px;border-radius:4px;background:var(--dusk);opacity:.4}
.ribbon .mark{position:absolute;top:9px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--dawn);border:2px solid var(--bg)}
.axis{direction:ltr;display:flex;justify-content:space-between;font-size:.6875rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;font-size:.75rem;color:var(--ink2)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.time{direction:ltr;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:44px;font-size:.875rem}
.grow{flex:1;min-width:0}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink2);display:flex;align-items:center;justify-content:center;flex:none}
.confirm{display:flex;gap:6px}
.confirm button{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8125rem}
.confirm .yes{background:var(--danger);color:var(--bg);border-color:var(--danger)}
.empty{padding:20px;border-radius:24px;border:1.5px dashed var(--line);color:var(--ink2);text-align:center}
.card{background:var(--surface);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.dark-card{background:var(--ink);color:var(--bg);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px}
.badge{align-self:flex-start;font-size:.75rem;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--dawn-soft);color:var(--dawn-text)}
.ok{background:var(--sage-soft);color:var(--sage)}
.note{font-size:.75rem;color:var(--ink2);line-height:1.6}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:500}
input[type=text],input[type=time],input[type=date],select{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:1rem}
.stepper{direction:ltr;display:flex;align-items:center;gap:14px}
.stepper button{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:1.4rem}
.stepper output{min-width:96px;text-align:center;font-size:1.375rem;font-weight:600;font-variant-numeric:tabular-nums}
.warn{border:2px solid var(--danger);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.warn h2{color:var(--danger)}
.prose{font-size:1.0625rem;line-height:1.75;max-width:65ch}
.prose ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px}
/* Bottom nav */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.brand{display:inline-flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.9375rem}
.brand svg{color:var(--dusk)}
.share-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:0;background:var(--dusk);color:var(--on-dusk);font-weight:600;font-size:.875rem}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;text-decoration:none;font-size:.6875rem;color:var(--ink2)}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:600}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(20,17,28,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{padding:0;margin-bottom:10px;font-weight:600}
.banner{font-size:.8125rem;padding:10px 14px;border-radius:14px;background:var(--dawn-soft);color:var(--dawn-text)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.topic{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);background:none;border-inline:0;border-top:0;width:100%;text-align:start}
.mono{width:44px;height:44px;border-radius:50%;background:var(--mist);color:var(--dusk);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.mono.warm{background:var(--dawn-soft);color:var(--dawn-text)}
.stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.stages li{display:flex;flex-direction:column;gap:6px;font-size:.6875rem;opacity:.75}
.stages li span{height:4px;border-radius:2px;background:currentColor;opacity:.5}
.stages li[aria-current="step"]{opacity:1;color:var(--dawn);font-weight:600}
.stages li[aria-current="step"] span{opacity:1}
</style>
</head>

const at=()=>AT[S.lang]||AT.he;
const Store={sb:null,fid:null,channel:null,timer:{},
 async init(){
  try{ this.sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}}); }catch(e){ S.mode='error'; S.ready=true; render(); return; }
  const {data}=await this.sb.auth.getSession();
  await this.onSession(data.session);
  this.sb.auth.onAuthStateChange((ev,sess)=>{ if(ev==='TOKEN_REFRESHED') return; if((sess&&sess.user&&sess.user.id)!==S.me) this.onSession(sess); });
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&this.fid) this.refetchAll(); });
 },
 async onSession(sess){
  S.session=sess||null; S.me=sess&&sess.user?sess.user.id:null; S.email=sess&&sess.user?sess.user.email:'';
  if(this.channel){ this.sb.removeChannel(this.channel); this.channel=null; }
  this.fid=null; S.fid=null; S.family={babies:[],active:{},sleep:{},milestones:{}}; S.events=[]; S.meds=[]; S.members=[];
  if(!S.me){ S.ready=true; S.mode='auth'; render(); return; }
  S.ready=false; render();
  const {data,error}=await this.sb.from('family_members').select('family_id').eq('user_id',S.me).order('joined_at',{ascending:true}).limit(1);
  if(error){ S.mode='error'; S.ready=true; render(); return; }
  if(data&&data.length){ await this.open(data[0].family_id); } else { S.mode='onboard'; S.ready=true; render(); }
 },
 async open(fid){
  this.fid=fid; S.fid=fid; S.mode='db'; S.view='today'; if((location.hash||'').slice(1)!=='today'){ try{ history.replaceState(null,'','#today'); }catch(e){} }
  await this.refetchAll();
  S.ready=true;
  const ch=this.sb.channel('family-'+fid);
  ch.on('postgres_changes',{event:'*',schema:'public',table:'events',filter:'family_id=eq.'+fid},()=>this.soon('events'))
    .on('postgres_changes',{event:'*',schema:'public',table:'meds',filter:'family_id=eq.'+fid},()=>this.soon('meds'))
    .on('postgres_changes',{event:'*',schema:'public',table:'families',filter:'id=eq.'+fid},()=>this.soon('family'))
    .subscribe();
  this.channel=ch; render();
 },
 soon(what){ clearTimeout(this.timer[what]); this.timer[what]=setTimeout(()=>this['load_'+what](),150); },
 async refetchAll(){ await Promise.all([this.load_family(),this.load_events(),this.load_meds(),this.load_members()]); },
 async load_family(){ const {data}=await this.sb.from('families').select('state,invite_code').eq('id',this.fid).maybeSingle(); if(data){ const s=data.state||{}; S.family={babies:s.babies||[],active:s.active||{},sleep:s.sleep||{},milestones:s.milestones||{}}; S.invite=data.invite_code; render(); } },
 async load_events(){ const {data}=await this.sb.from('events').select('id,baby,type,t,data,by_user').eq('family_id',this.fid).order('t',{ascending:false}).limit(400); if(data){ S.events=data.map(r=>Object.assign({},r.data||{},{id:r.id,baby:r.baby,type:r.type,t:Number(r.t),by:r.by_user})); const known=new Set(S.members.map(m=>m.user_id)); if(S.events.some(e=>e.by&&!known.has(e.by))) this.load_members(); render(); } },
 async load_meds(){ const {data}=await this.sb.from('meds').select('id,baby,name,note').eq('family_id',this.fid).order('created_at'); if(data){ S.meds=data; render(); } },
 async load_members(){ const {data}=await this.sb.from('family_members').select('user_id,display_name').eq('family_id',this.fid); if(data){ S.members=data; render(); } },
 async fam(patch){
  const deep=(a,b)=>{ const r=Object.assign({},a); for(const k in b){ const v=b[k]; r[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&r[k]&&typeof r[k]==='object')?deep(r[k],v):v; } return r; };
  S.family=deep(S.family,patch); render();
  if(!this.fid) return;
  const {data,error}=await this.sb.rpc('patch_family_state',{p_family:this.fid,p_patch:patch});
  if(error){ say(at().notSaved); this.load_family(); return; }
  if(data){ S.family={babies:data.babies||[],active:data.active||{},sleep:data.sleep||{},milestones:data.milestones||{}}; render(); }
 },
 async addEvent(ev){
  const {baby,type,t:tm}=ev; const rest=Object.assign({},ev); delete rest.baby; delete rest.type; delete rest.t;
  const tmp={id:'tmp'+uid(),baby,type,t:tm,by:S.me}; Object.assign(tmp,rest); S.events=[tmp].concat(S.events).sort((a,b)=>b.t-a.t); render();
  const {error}=await this.sb.from('events').insert({family_id:this.fid,baby,type,t:tm,data:rest});
  if(error) say(at().notSaved);
  this.load_events();
 },
 async delEvent(id){ S.events=S.events.filter(e=>e.id!==id); render(); if(String(id).startsWith('tmp')) return; await this.sb.from('events').delete().eq('id',id); this.load_events(); },
 async addMed(m){ const {error}=await this.sb.from('meds').insert({family_id:this.fid,baby:m.baby,name:m.name,note:m.note||''}); if(error) say(at().notSaved); this.load_meds(); },
 async delMed(id){ S.meds=S.meds.filter(m=>m.id!==id); render(); await this.sb.from('meds').delete().eq('id',id); this.load_meds(); },
 async createFamily(name,babies){
  const {data,error}=await this.sb.rpc('create_family',{p_display_name:name});
  if(error||!data) throw error||new Error('create failed');
  const fid=data.id; this.fid=fid;
  await this.sb.rpc('patch_family_state',{p_family:fid,p_patch:{babies}});
  await this.open(fid);
 },
 async joinFamily(code,name){
  const {data,error}=await this.sb.rpc('join_family',{p_code:code,p_display_name:name});
  if(error||!data) throw error||new Error('join failed');
  await this.open(data);
 },
 async signOut(){ await this.sb.auth.signOut(); }
};

// ---------- derived ----------
function baby(){ const b=S.family.babies||[]; return b.find(x=>x.id===S.babyId)||b[0]||null; }
function evs(){ const b=baby(); return b?S.events.filter(e=>e.baby===b.id):[]; }
function whoLabel(id){ if(!id) return ''; if(id===S.me) return t().you; const m=(S.members||[]).find(x=>x.user_id===id); return (m&&m.display_name)||t().partner; }
let resolving=false;
async function resolveNames(){
 return;
 const ids=[...new Set(S.events.map(e=>e.by).concat(Object.values(S.family.active||{}).map(a=>a&&a.by)).filter(Boolean))].filter(id=>!(id in S.names)&&id!==S.me);
 if(!ids.length) return;
 resolving=true;
 try{ const ps=await Store.user.profiles(ids); let changed=false; ids.forEach(id=>{const n=(ps[id]&&ps[id].name)||'';S.names[id]=n||t().partner;changed=true;}); if(changed) render(); }catch(e){}
 resolving=false;
}
function ageWeeks(b){ if(!b||!b.born) return null; const d=(Date.now()-new Date(b.born+'T00:00:00').getTime())/864e5; return d<0?null:d; }
function stageIndex(days){ if(days==null) return 2; if(days<7) return 0; if(days<14) return 1; if(days<21) return 2; if(days<42) return 3; return 4; }
function evText(e){
 const L=t();
 if(e.type==='feed') return L.ev.feed+', '+(e.side==='L'?L.left:e.side==='R'?L.right:L.both)+(e.mins?', '+e.mins+' '+L.min:'');
 if(e.type==='bottle') return L.ev.bottle+(e.ml?', '+e.ml+' '+L.ml:'');
 if(e.type==='pump') return L.ev.pump+(e.ml?', '+e.ml+' '+L.ml:'');
 if(e.type==='diaper') return L.ev.diaper+', '+(L.kinds[e.kind]||'');
 if(e.type==='sleep') return L.ev.sleep+(e.mins?', '+e.mins+' '+L.min:'');
 if(e.type==='med') return e.medName||L.ev.med;
 if(e.type==='taste'){ const F=FT[S.lang]||FT.he; const lk=F.likes.find(l=>l[0]===e.liked); return F.tasteEv+': '+fname(e.food)+(lk?', '+lk[1]:'')+(e.reaction?', '+F.reactionEv:''); }
 return '';
}

const fname=(id)=>{ const f=FOODS.find(x=>x[0]===id); if(!f) return id; return S.lang==='en'?f[4]:S.lang==='ar'?f[5]:f[3]; };
function tasteStats(){
 const m={}; evs().filter(e=>e.type==='taste').forEach(e=>{ const s=m[e.food]||(m[e.food]={n:0,liked:null,reaction:false,last:0}); s.n++; if(e.reaction) s.reaction=true; if(e.t>s.last){s.last=e.t;s.liked=e.liked;} });
 return m;
}
function viewFoods(){
 const L=t(), F=FT[S.lang]||FT.he, b=baby(); if(!b) return viewSetup();
 const st=tasteStats(), cat=S.foodCat||'all';
 const tastedN=Object.keys(st).length;
 const likeLabel=v=>{ const x=F.likes.find(l=>l[0]===v); return x?x[1]:''; };
 const allergenRow='<ul class="list" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px">'+FOODS.filter(f=>f[2]).map(f=>{
  const s=st[f[0]]; const state=!s?'not':s.reaction?'bad':'ok';
  const color=state==='bad'?'var(--danger)':state==='ok'?'var(--sage)':'var(--line)';
  return '<li style="padding:10px 0;gap:10px"><span aria-hidden="true" style="width:12px;height:12px;border-radius:50%;flex:none;background:'+color+'"></span><span class="grow section" style="gap:0"><span style="font-weight:500">'+esc(fname(f[0]))+'</span><span class="small muted">'+esc(state==='bad'?F.alBad:state==='ok'?F.alOk:F.alNot)+'</span></span></li>';
 }).join('')+'</ul>';
 const list=FOODS.filter(f=>cat==='all'||(cat==='allg'?f[2]:f[1]===cat)).map(f=>{
  const s=st[f[0]];
  const meta=s?F.times(s.n)+(s.liked?', '+likeLabel(s.liked):''):F.notYet;
  return '<button type="button" class="topic" data-act="taste" data-food="'+f[0]+'"><span class="mono'+(f[2]?' warm':'')+'" aria-hidden="true">'+(s?IC.check:esc(fname(f[0]).slice(0,1)))+'</span><span class="grow section" style="gap:2px"><span style="font-weight:500">'+esc(fname(f[0]))+'</span><span class="small muted">'+esc(meta)+(s&&s.reaction?' · '+esc(F.alBad):'')+'</span></span></button>';
 }).join('');
 const ri=S.lang==='en'?1:S.lang==='ar'?2:0;
 const recipes=RECIPES.map((r,i)=>{
  const missing=r[3].filter(x=>!st[x]); const open=S.openRecipe===i;
  return '<li style="list-style:none;border-bottom:1px solid var(--line)"><button type="button" class="topic" style="border:0" data-act="recipe" data-i="'+i+'" aria-expanded="'+open+'"><span class="grow section" style="gap:2px"><span style="font-weight:500">'+esc(r[ri])+'</span><span class="small" style="color:'+(missing.length?'var(--ink2)':'var(--sage)')+'">'+esc(missing.length?F.needs(missing.map(fname).join(', ')):F.fits)+'</span></span></button>'+
   (open?'<p style="padding:0 0 14px;line-height:1.7">'+esc(r[4+ri])+'</p>':'')+'</li>';
 }).join('');
 return '<header class="section" style="gap:16px"><div class="between"><div class="section" style="gap:2px"><h1>'+esc(F.title)+'</h1><p class="muted small">'+esc(b.name+', '+F.tasted(tastedN))+'</p></div><a class="pill" href="#family">'+esc(L.familyLink)+'</a></div>'+babySwitch()+'</header>'+
 (tastedN===0?'<section class="dark-card"><h2 style="font-size:1.125rem">'+esc(F.ready)+'</h2><p>'+esc(F.readyText)+'</p><ul style="margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px">'+F.readyList.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><p class="small" style="opacity:.85">'+esc(F.readyNote)+'</p></section>':'')+
 '<section class="section"><h2>'+esc(F.allergens)+'</h2>'+allergenRow+'</section>'+
 '<section class="section"><div class="chips" role="group" aria-label="'+esc(F.title)+'">'+F.cats.map(c=>'<button type="button" class="chip" data-act="fcat" data-v="'+c[0]+'" aria-pressed="'+(cat===c[0])+'">'+esc(c[1])+'</button>').join('')+'</div><div>'+list+'</div></section>'+
 '<section class="section"><h2>'+esc(F.recipes)+'</h2><ul style="margin:0;padding:0">'+recipes+'</ul></section>'+
 '<section class="warn" style="border-color:var(--line)"><h2 style="color:var(--ink)">'+esc(F.safety)+'</h2><ul style="margin:0;padding-inline-start:20px;line-height:1.6;display:flex;flex-direction:column;gap:4px">'+F.safetyList.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></section>'+
 '<p class="prose" style="font-size:1rem">'+esc(F.calm)+'</p><p class="note">'+esc(F.source)+'</p>';
}
function tasteSheetBody(){
 const F=FT[S.lang]||FT.he, f=FOODS.find(x=>x[0]===sheet.food);
 const chips=(name,opts,val)=>'<div class="chips">'+opts.map(o=>'<button type="button" class="chip" data-sh="'+name+'" data-v="'+o[0]+'" aria-pressed="'+(String(val)===String(o[0]))+'">'+esc(o[1])+'</button>').join('')+'</div>';
 return '<p class="card" style="gap:4px"><strong style="font-weight:600">'+esc(F.how)+'</strong><span>'+esc((HINT[f[6]]||{})[S.lang]||'')+'</span></p>'+
  (f[2]?'<p class="banner">'+esc(F.allergenTip)+'</p>':'')+
  '<fieldset><legend>'+esc(F.liked)+'</legend>'+chips('liked',F.likes,sheet.liked)+'</fieldset>'+

  '<label class="row" for="sh-react" style="min-height:44px;gap:12px"><input id="sh-react" type="checkbox" style="width:24px;height:24px;accent-color:var(--danger)"'+(sheet.reaction?' checked':'')+'><span>'+esc(F.reaction)+'</span></label>'+
  (sheet.reaction?'<p class="warn" role="alert" style="font-weight:600;color:var(--danger)">'+esc(F.emergency)+'</p>':'');
}

 if(a==='delno'){ S.confirmDel=null; render(); return; }
 if(a==='delyes'){ Store.delEvent(el.dataset.id); S.confirmDel=null; render(); return; }
 if(a==='medgive'){ const m=S.meds.find(x=>x.id===el.dataset.id); if(m){ Store.addEvent({baby:b.id,type:'med',t:Date.now(),medId:m.id,medName:m.name}); say(L.saved); } return; }
 if(a==='medundo'){ Store.delEvent(el.dataset.id); return; }
 if(a==='medask'){ S.confirmMed=el.dataset.id; render(); return; }
 if(a==='medno'){ S.confirmMed=null; render(); return; }
 if(a==='medyes'){ Store.delMed(el.dataset.id); S.confirmMed=null; render(); return; }
});
document.addEventListener('submit',e=>{
 const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
 const L=t();
 if(f.dataset.form==='auth'){
  const A=at(), up=S.authMode!=='login', email=document.getElementById('auth-email').value.trim(), pw=document.getElementById('auth-pw').value;
  if(!email||pw.length<6){ S.authMsg=pw.length<6?A.weakPw:A.authErr; render(); return; }
  S.busy=true; S.authMsg=''; render();
  (async()=>{ try{ if(up){ const {data,error}=await Store.sb.auth.signUp({email,password:pw}); if(error) throw error; if(!data.session) S.authMsg=A.checkEmail; } else { const {error}=await Store.sb.auth.signInWithPassword({email,password:pw}); if(error) throw error; } }
   catch(err){ S.authMsg=A.authErr+(err&&err.message?' ('+err.message+')':''); } S.busy=false; render(); })();
  return;
 }
 if(f.dataset.form==='join'){
  const A=at(), code=document.getElementById('join-code').value.replace(/\D/g,''), name=document.getElementById('join-name').value.trim();
  if(code.length!==6){ S.authMsg=A.badCode; render(); return; }
  S.busy=true; S.authMsg=''; render();
  Store.joinFamily(code,name).then(()=>{ S.busy=false; S.draft={}; S.onb=''; render(); },()=>{ S.busy=false; S.authMsg=A.badCode; render(); });
  return;
 }
 if(f.dataset.form==='setup'){
  const n1=document.getElementById('setup-name').value.trim(), born=document.getElementById('setup-born').value, n2el=document.getElementById('setup-name2'), n2=S.setupTwins&&n2el?n2el.value.trim():'';
  if(!n1) return;
  const bs=[{id:'b'+uid(),name:n1,born:born||''}]; if(n2) bs.push({id:'b'+uid(),name:n2,born:born||''});
  S.babyId=bs[0].id; ls.set('gp-baby',S.babyId); document.activeElement&&document.activeElement.blur();
  if(S.fid){ S.draft={}; Store.fam({babies:bs}); render(); return; }
  const me=(document.getElementById('setup-me')||{}).value||''; S.busy=true; S.authMsg=''; render();
  Store.createFamily(me.trim(),bs).then(()=>{ S.draft={}; S.busy=false; S.onb=''; render(); },err=>{ S.busy=false; S.authMsg=at().notSaved+(err&&err.message?' ('+err.message+')':''); render(); }); return;
 }
 if(f.dataset.form==='med'){
  const b=baby(); const n=document.getElementById('med-name').value.trim(), note=document.getElementById('med-note').value.trim(); if(!n||!b) return;
  Store.addMed({name:n,note,baby:b.id}); delete S.draft['med-name']; delete S.draft['med-note']; document.activeElement&&document.activeElement.blur(); say(L.saved); if(!Store.db) return; render();
 }
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='setup-twins'){ S.setupTwins=el.checked; render(); requestAnimationFrame(()=>requestAnimationFrame(()=>{ const n=document.getElementById(el.checked?'setup-name2':'setup-twins'); if(n) n.focus(); })); return; }
 if(el.dataset.ms){ const b=baby(); if(b){ Store.fam({milestones:{[b.id]:{[el.dataset.ms]:el.checked?Date.now():null}}}); say(t().saved); } return; }
 if(el.dataset.babyName!==undefined||el.dataset.babyBorn!==undefined){
  const id=el.dataset.babyName||el.dataset.babyBorn;
  const bs=(S.family.babies||[]).map(x=>x.id===id?Object.assign({},x,el.dataset.babyName!==undefined?{name:el.value.trim()||x.name}:{born:el.value}):x);
  Store.fam({babies:bs}); say(t().saved);
 }
});
document.addEventListener('input',e=>{ const el=e.target; if(el.id&&el.closest('#view')) S.draft[el.id]=el.value; });

// ---------- routing ----------
const VIEWS=['today','feeding','article','meds','family','community','foods','dev'];
function route(){ const h=(location.hash||'').slice(1); S.view=VIEWS.includes(h)?h:'today'; S.confirmDel=null; S.confirmMed=null; draw(); const v=document.getElementById('view'); if(h) v.focus({preventScroll:true}); window.scrollTo(0,0); }
window.addEventListener('hashchange',route);
route();
Store.init();
})();
</script>
